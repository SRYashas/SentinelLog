<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post-Installation Setup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #050508;
    font-family: 'Consolas', 'Courier New', 'Lucida Console', monospace;
    color: #b8e0d2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .window {
    width: 640px;
    max-width: 95vw;
    background: linear-gradient(180deg, #0a1419 0%, #06121a 100%);
    border: 1px solid #1f4d5e;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,255,200,0.08), inset 0 0 0 1px rgba(0,255,200,0.05);
    overflow: hidden;
    animation: windowAppear 0.4s ease;
  }
  @keyframes windowAppear {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  .titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    background: #071520;
    border-bottom: 1px solid #1f4d5e;
    user-select: none;
  }
  .titlebar-title {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: #88d8c8;
  }
  .titlebar-controls { display: flex; gap: 6px; }
  .titlebar-btn {
    width: 11px; height: 11px; border-radius: 50%;
    border: 1px solid #000; box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
  }
  .btn-close { background: #c0392b; }
  .btn-min { background: #d4ac0d; }
  .btn-max { background: #27ae60; }
  .body { padding: 20px 22px 22px; }
  .header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
  }
  .icon {
    width: 36px; height: 36px;
    border: 1px solid #1f4d5e;
    border-radius: 50%;
    background: rgba(0,255,200,0.04);
    object-fit: cover;
  }
  .header-text h2 {
    font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #e0f7fa; font-weight: normal;
  }
  .header-text p {
    font-size: 10px; color: #7aa9b6; margin-top: 3px; letter-spacing: 0.5px;
  }
  .prereq-list {
    list-style: none;
    border: 1px solid #1f4d5e;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 16px;
    background: #050f15;
  }
  .prereq-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px;
    border-bottom: 1px solid #0c2a38;
    font-size: 11px;
    transition: background 0.3s;
  }
  .prereq-item:last-child { border-bottom: none; }
  .prereq-item.installing { background: rgba(0,255,200,0.05); }
  .prereq-item.done { background: rgba(0,255,200,0.03); }
  .prereq-name { color: #c8e6dc; flex: 1; }
  .prereq-desc {
    color: #5a8a96; margin-left: 8px; font-size: 10px; font-style: italic;
  }
  .prereq-status {
    min-width: 72px; text-align: right; padding-left: 10px;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
  }
  .status-missing { color: #e74c3c; }
  .status-installed { color: #2ecc71; }
  .status-installing { color: #f1c40f; }
  .progress-wrap {
    height: 3px; background: #0c2a38; border-radius: 2px; overflow: hidden;
    margin: 8px 0 14px; display: none;
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #00ffc8, #00a8ff);
    transition: width 0.4s linear;
    box-shadow: 0 0 8px rgba(0,255,200,0.5);
  }
  .actions {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
  }
  .btn {
    flex: 1;
    padding: 9px 0;
    border: 1px solid #1f4d5e;
    background: #0a2530;
    color: #b8e0d2;
    font-family: inherit; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer; border-radius: 3px;
    transition: all 0.2s;
  }
  .btn:hover:not(:disabled) { background: #0e3045; border-color: #00ffc8; color: #00ffc8; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: #00ffc8; color: #020f14; border-color: #00ffc8; font-weight: bold;
  }
  .btn-primary:hover:not(:disabled) { background: #0cffd8; box-shadow: 0 0 14px rgba(0,255,200,0.4); }
  .log {
    margin-top: 12px; padding: 8px 10px;
    background: #020a10; border: 1px solid #1f4d5e;
    border-radius: 3px; height: 84px; overflow-y: auto;
    font-size: 10px; line-height: 1.5; color: #5a8a96;
  }
  .log-line { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .log-line .ts { color: #2a6068; margin-right: 6px; }
  .log-line.ok { color: #2ecc71; }
  .log-line.warn { color: #f1c40f; }
  .log-line.err { color: #e74c3c; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #050f15; }
  ::-webkit-scrollbar-thumb { background: #1f4d5e; border-radius: 3px; }
</style>
</head>
<body>
<div class="backdrop">
  <div class="window">
    <div class="titlebar">
      <div class="titlebar-title">Setup Assistant v3.4.2</div>
      <div class="titlebar-controls">
        <div class="titlebar-btn btn-min"></div>
        <div class="titlebar-btn btn-max"></div>
        <div class="titlebar-btn btn-close"></div>
      </div>
    </div>
    <div class="body">
      <div class="header">
        <img class="icon" src="file:///C:/Users/YASHAS/Downloads/icon.ico" alt="App Icon" />
        <div class="header-text">
          <h2>Prerequisite Verification</h2>
          <p>Required components detected before first launch</p>
        </div>
      </div>

      <ul class="prereq-list" id="prereqList"></ul>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="log" id="log"><p class="log-line"><span class="ts">[--:--:--]</span>Awaiting user action...</p></div>

      <div class="actions">
        <button class="btn" id="btnSkip">Skip Setup</button>
        <button class="btn btn-primary" id="btnInstall">Install All</button>
      </div>
    </div>
  </div>
</div>

<script>
const PREREQS = [
  { name: 'Microsoft Visual C++ 2015-2022 Redist', desc: 'Runtime libs x64', installed: false, delay: 900 },
  { name: '.NET Desktop Runtime 8.0', desc: 'Hosting bundle', installed: false, delay: 1200 },
  { name: 'Intel Neural Compute Stick Driver', desc: 'USB/NCS firmware', installed: true, delay: 600 },
  { name: 'OpenCL ICD Loader', desc: 'GPU acceleration', installed: false, delay: 800 },
  { name: 'SQLite3 Native Extension', desc: 'Local ledger DB', installed: true, delay: 400 }
];

const els = {
  list: document.getElementById('prereqList'),
  progressWrap: document.getElementById('progressWrap'),
  progressBar: document.getElementById('progressBar'),
  log: document.getElementById('log'),
  btnInstall: document.getElementById('btnInstall'),
  btnSkip: document.getElementById('btnSkip')
};

function now() {
  const d = new Date();
  return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
}

function log(msg, cls='') {
  const p = document.createElement('p');
  p.className = 'log-line ' + cls;
  p.innerHTML = `<span class="ts">[${now()}]</span>${msg}`;
  els.log.appendChild(p);
  els.log.scrollTop = els.log.scrollHeight;
}

function renderList() {
  els.list.innerHTML = '';
  PREREQS.forEach((p, i) => {
    const li = document.createElement('li');
    li.className = 'prereq-item';
    li.id = `item-${i}`;
    let status = p.installed
      ? `<span class="prereq-status status-installed">Installed</span>`
      : `<span class="prereq-status status-missing">Missing</span>`;
    li.innerHTML = `
      <span class="prereq-name">${p.name}</span>
      <span class="prereq-desc">${p.desc}</span>
      ${status}
    `;
    els.list.appendChild(li);
  });
}

function updateItem(index, statusClass, statusText) {
  const item = document.getElementById(`item-${index}`);
  if (!item) return;
  const statusEl = item.querySelector('.prereq-status');
  statusEl.className = `prereq-status ${statusClass}`;
  statusEl.textContent = statusText;
  if (statusClass === 'status-installing') item.classList.add('installing');
  if (statusClass === 'status-installed') item.classList.add('done');
}

async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function installAll() {
  els.btnInstall.disabled = true;
  els.btnSkip.disabled = true;
  els.progressWrap.style.display = 'block';
  const total = PREREQS.filter(p => !p.installed).length;
  let done = 0;

  for (let i = 0; i < PREREQS.length; i++) {
    const p = PREREQS[i];
    if (p.installed) {
      log(`Skipping ${p.name}: already present`, 'ok');
      continue;
    }
    updateItem(i, 'status-installing', 'Installing');
    log(`Downloading ${p.name}...`, 'warn');
    await sleep(p.delay);
    updateItem(i, 'status-installed', 'Installed');
    log(`Installed ${p.name} successfully.`, 'ok');
    done++;
    els.progressBar.style.width = `${(done / total) * 100}%`;
  }

  log('All prerequisites resolved. Verifying integrity...', 'ok');
  await sleep(500);
  els.progressBar.style.width = '100%';
  await sleep(200);
  log('Setup complete. Application is ready to launch.', 'ok');

  els.btnInstall.textContent = 'Finish';
  els.btnInstall.disabled = false;
  els.btnInstall.classList.remove('btn-primary');
  els.btnInstall.onclick = () => {
    log('Launching application...', 'ok');
    setTimeout(() => alert('Application launched successfully.'), 300);
  };
}

function cancelSetup() {
  log('Setup cancelled by user.', 'err');
  els.btnInstall.disabled = true;
  els.btnSkip.textContent = 'Closed';
  els.btnSkip.disabled = true;
}

renderList();
els.btnInstall.addEventListener('click', installAll);
els.btnSkip.addEventListener('click', cancelSetup);
</script>
</body>
</html>
